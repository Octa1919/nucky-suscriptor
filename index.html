<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Suscriptor - Nucky SaaS</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { 
            --primary: #a3e635; 
            --dark: #0f172a; 
            --gray: #1e2937; 
        }
        body { 
            font-family: system-ui, sans-serif; 
            background: #020617; 
            color: white; 
            margin:0; 
        }
        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 15px; 
        }
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 15px 0; 
            border-bottom: 1px solid #334155; 
        }
        .tabs { 
            display: flex; 
            gap: 8px; 
            margin: 20px 0; 
            flex-wrap: wrap; 
            overflow-x: auto; 
            padding-bottom: 10px; 
        }
        .tab { 
            padding: 10px 16px; 
            background: var(--gray); 
            border-radius: 10px; 
            cursor: pointer; 
            font-size: 0.95em; 
            white-space: nowrap; 
        }
        .tab.active { 
            background: var(--primary); 
            color: black; 
            font-weight: bold; 
        }
        .card { 
            background: var(--gray); 
            border-radius: 16px; 
            padding: 20px; 
            margin-bottom: 20px; 
        }
        label { 
            display: block; 
            margin: 16px 0 6px; 
            font-size: 0.9em; 
            color: #94a3b8; 
        }
        input, textarea { 
            width: 100%; 
            padding: 14px; 
            background: #334155; 
            border: 1px solid #475569; 
            border-radius: 12px; 
            color: white; 
            font-size: 1em; 
        }
        .btn { 
            padding: 14px; 
            width: 100%; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            font-weight: bold; 
            margin-top: 20px; 
        }
        .btn-primary { background: var(--primary); color: black; }
        .btn-danger { background: #ef4444; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👤 Panel Suscriptor</h1>
            <button class="btn btn-danger" onclick="logout()">Salir</button>
        </div>

        <div class="tabs">
            <div class="tab" onclick="switchTab(0)">Inicio</div>
            <div class="tab" onclick="switchTab(1)">Configuración</div>
            <div class="tab" onclick="switchTab(2)">Ruleta</div>
            <div class="tab active" onclick="switchTab(3)">Usuarios</div>
            <div class="tab" onclick="switchTab(4)">Difusión</div>
        </div>

        <div id="tab-content"></div>
    </div>

    <script>
        const SUPABASE_URL = "https://vevptiayzleigkjtmyhc.supabase.co";
        const SUPABASE_KEY = "sb_publishable_VBu6hcwr-NKDyxcOc60wDQ_RFDkKQjd";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentSubscriberId = null; // Se cargará después del login

        async function switchTab(tab) {
            document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === tab));
            const content = document.getElementById('tab-content');

            if (tab === 3) { // Usuarios
                content.innerHTML = `
                    <div class="card">
                        <h2>👥 Gestión de Usuarios</h2>
                        <button class="btn btn-primary" onclick="showNewUserModal()">+ Nuevo Usuario</button>
                        <div id="lista-usuarios" style="margin-top:20px;"></div>
                    </div>
                `;
                cargarUsuarios();
            } else if (tab === 2) {
                content.innerHTML = `... Ruleta anterior ...`;
            } else {
                content.innerHTML = `<h2>Sección en desarrollo</h2>`;
            }
        }

        async function cargarUsuarios() {
            // Simulación por ahora (después filtraremos por currentSubscriberId)
            const { data } = await _supabase.from('usuarios').select('*').limit(20);
            const div = document.getElementById('lista-usuarios');
            div.innerHTML = data.map(u => `
                <div style="background:#334155; padding:15px; border-radius:12px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;">
                    <div>
                        <strong>${u.username}</strong><br>
                        <small>${u.telefono || 'Sin teléfono'}</small>
                    </div>
                    <button class="btn btn-danger" style="padding:6px 12px; font-size:0.85em;" onclick="eliminarUsuario('${u.id}')">Eliminar</button>
                </div>
            `).join('');
        }

        function showNewUserModal() {
            const username = prompt("Nombre de usuario:");
            const telefono = prompt("Teléfono (opcional):");
            if (username) {
                alert(`Usuario "${username}" creado (en desarrollo)`);
                cargarUsuarios();
            }
        }

        function eliminarUsuario(id) {
            if (confirm("¿Eliminar este usuario?")) {
                alert("Usuario eliminado (en desarrollo)");
                cargarUsuarios();
            }
        }

        function logout() {
            if (confirm("¿Cerrar sesión?")) location.reload();
        }

        window.onload = () => {
            switchTab(3); // Abre directamente en Usuarios
        };
    </script>
</body>
</html>
