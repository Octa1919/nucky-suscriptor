<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Suscriptor - Nucky SaaS</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #a3e635; --dark: #0f172a; --gray: #1e2937; }
        body { font-family: system-ui, sans-serif; background: #020617; color: white; margin:0; }
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #334155; }
        .tabs { display: flex; gap: 8px; margin: 20px 0; flex-wrap: wrap; overflow-x: auto; padding-bottom: 10px; }
        .tab { padding: 10px 16px; background: var(--gray); border-radius: 10px; cursor: pointer; font-size: 0.95em; white-space: nowrap; }
        .tab.active { background: var(--primary); color: black; font-weight: bold; }
        .card { background: var(--gray); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
        label { display: block; margin: 16px 0 6px; font-size: 0.9em; color: #94a3b8; }
        input, textarea { width: 100%; padding: 14px; background: #334155; border: 1px solid #475569; border-radius: 12px; color: white; font-size: 1em; }
        .btn { padding: 14px; width: 100%; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; margin-top: 20px; }
        .btn-primary { background: var(--primary); color: black; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👤 Panel Suscriptor</h1>
            <button class="btn btn-danger" onclick="logout()">Salir</button>
        </div>

        <div class="tabs">
            <div class="tab" onclick="switchTab(0)">Inicio</div>
            <div class="tab" onclick="switchTab(1)">Configuración</div>
            <div class="tab" onclick="switchTab(2)">Ruleta</div>
            <div class="tab" onclick="switchTab(3)">Usuarios</div>
            <div class="tab" onclick="switchTab(4)">Difusión</div>
        </div>

        <div id="tab-content"></div>
    </div>

    <script>
        const SUPABASE_URL = "https://vevptiayzleigkjtmyhc.supabase.co";
        const SUPABASE_KEY = "sb_publishable_VBu6hcwr-NKDyxcOc60wDQ_RFDkKQjd";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentSubscriberId = null; // Se cargará después del login real

        async function switchTab(tab) {
            document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === tab));
            const content = document.getElementById('tab-content');

            if (tab === 1) { // Configuración General
                content.innerHTML = `
                    <div class="card">
                        <h2>Configuración General</h2>
                        <label>Nombre del Casino</label>
                        <input type="text" id="nombre-casino">
                        <label>WhatsApp de atención</label>
                        <input type="text" id="whatsapp">
                        <label>Links de Salas (4)</label>
                        <input type="text" id="sala1" placeholder="Sala 1">
                        <input type="text" id="sala2" placeholder="Sala 2">
                        <input type="text" id="sala3" placeholder="Sala 3">
                        <input type="text" id="sala4" placeholder="Sala 4">
                        <button class="btn btn-primary" onclick="guardarConfiguracion()">Guardar Configuración</button>
                    </div>
                `;
            } else if (tab === 2) { // Ruleta
                content.innerHTML = `
                    <div class="card">
                        <h2>🎰 Configuración de Ruleta</h2>
                        <label>Premios Ruleta Normal (separados por coma)</label>
                        <input type="text" id="premios-normal" placeholder="3000,5000,8000,10000,15000,20000">
                        <label>Premios Ruleta Dorada (separados por coma)</label>
                        <input type="text" id="premios-dorada" placeholder="15000,25000,40000,50000,100000">
                        <label>Días para activar Ruleta Dorada</label>
                        <input type="number" id="dias-dorada" value="7" min="1">
                        <button class="btn btn-primary" onclick="guardarRuleta()">Guardar Configuración de Ruleta</button>
                    </div>
                `;
            } else {
                content.innerHTML = `<h2>Sección en desarrollo</h2>`;
            }
        }

        async function guardarConfiguracion() {
            const nombre = document.getElementById('nombre-casino').value.trim();
            const whatsapp = document.getElementById('whatsapp').value.trim();

            if (!currentSubscriberId) return alert("Error: No se detectó el suscriptor");

            const { error } = await _supabase
                .from('suscriptores')
                .update({ 
                    nombre_casino: nombre,
                    whatsapp: whatsapp 
                })
                .eq('id', currentSubscriberId);

            if (error) alert("Error al guardar: " + error.message);
            else alert("✅ Configuración General guardada correctamente");
        }

        async function guardarRuleta() {
            const normal = document.getElementById('premios-normal').value.trim();
            const dorada = document.getElementById('premios-dorada').value.trim();
            const dias = parseInt(document.getElementById('dias-dorada').value);

            if (!currentSubscriberId) return alert("Error: No se detectó el suscriptor");

            const { error } = await _supabase
                .from('config_ruleta')
                .upsert({
                    subscriber_id: currentSubscriberId,
                    premios_normal: normal.split(',').map(p => p.trim()),
                    premios_dorada: dorada.split(',').map(p => p.trim()),
                    dias_dorada: dias
                });

            if (error) alert("Error al guardar: " + error.message);
            else alert("✅ Configuración de Ruleta guardada correctamente");
        }

        function logout() {
            if (confirm("¿Cerrar sesión?")) location.reload();
        }

        window.onload = () => {
            // Simulación de login (cambiar después)
            currentSubscriberId = "prueba-id"; 
            switchTab(1); // Abre en Configuración
        };
    </script>
</body>
</html>
