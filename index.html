<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Suscriptor - Nucky SaaS</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #a3e635; --dark: #0f172a; --gray: #1e2937; }
        * { box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #020617; color: white; margin:0; }
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #334155; }
        .tabs { display: flex; gap: 8px; margin: 20px 0; flex-wrap: wrap; overflow-x: auto; padding-bottom: 10px; }
        .tab { padding: 10px 16px; background: var(--gray); border-radius: 10px; cursor: pointer; font-size: 0.95em; white-space: nowrap; }
        .tab.active { background: var(--primary); color: black; font-weight: bold; }
        .card { background: var(--gray); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
        label { display: block; margin: 16px 0 6px; font-size: 0.9em; color: #94a3b8; }
        input, textarea { width: 100%; padding: 14px 16px; background: #334155; border: 1px solid #475569; border-radius: 12px; color: white; font-size: 1em; }
        .btn { padding: 14px; width: 100%; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; margin-top: 20px; }
        .btn-primary { background: var(--primary); color: black; }
        .btn-danger { background: #ef4444; color: white; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: var(--gray); padding: 25px; border-radius: 16px; width: 90%; max-width: 460px; }
    </style>
</head>
<body>
    <div class="container">

        <!-- Login Screen -->
        <div id="login-screen">
            <div class="card">
                <h2 style="text-align:center;">👤 Iniciar Sesión</h2>
                <label>Usuario</label>
                <input type="text" id="login-user" placeholder="Usuario">
                <label>Contraseña</label>
                <input type="password" id="login-pass" placeholder="Contraseña">
                <button class="btn btn-primary" onclick="loginSuscriptor()">Entrar</button>
            </div>
        </div>

        <!-- Dashboard -->
        <div id="dashboard" style="display:none;">
            <div class="header">
                <h1>👤 Panel Suscriptor</h1>
                <button class="btn btn-danger" onclick="logout()">Salir</button>
            </div>

            <div class="tabs">
                <div class="tab" onclick="switchTab(0)">Inicio</div>
                <div class="tab" onclick="switchTab(1)">Configuración</div>
                <div class="tab" onclick="switchTab(2)">Ruleta</div>
                <div class="tab active" onclick="switchTab(3)">Usuarios</div>
                <div class="tab" onclick="switchTab(4)">Difusión</div>
            </div>

            <div id="tab-content"></div>
        </div>
    </div>

    <!-- Modal Nuevo Usuario -->
    <div id="modal-nuevo-usuario" class="modal">
        <div class="modal-content">
            <h2>Crear Nuevo Usuario</h2>
            <label>Nombre de Usuario</label>
            <input type="text" id="new-username">
            <label>Contraseña</label>
            <input type="text" id="new-password">
            <label>Teléfono</label>
            <input type="text" id="new-telefono">
            <button class="btn btn-primary" onclick="crearNuevoUsuario()">Crear Usuario</button>
            <button class="btn btn-danger" onclick="hideNewUserModal()">Cancelar</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://vevptiayzleigkjtmyhc.supabase.co";
        const SUPABASE_KEY = "sb_publishable_VBu6hcwr-NKDyxcOc60wDQ_RFDkKQjd";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentSubscriberId = null;

        async function loginSuscriptor() {
            const username = document.getElementById('login-user').value.trim();
            const password = document.getElementById('login-pass').value.trim();

            if (!username || !password) return alert("Usuario y contraseña son obligatorios");

            const { data, error } = await _supabase
                .from('suscriptores_users')
                .select('*, suscriptores(id)')
                .eq('nombre', username)
                .eq('password', password)
                .single();

            if (error || !data) return alert("Credenciales incorrectas");

            currentSubscriberId = data.suscriptores.id;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            switchTab(3); // Abre en Usuarios
        }

        async function switchTab(tab) {
            document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === tab));
            const content = document.getElementById('tab-content');

            if (tab === 3) {
                content.innerHTML = `
                    <div class="card">
                        <h2>👥 Usuarios Jugadores</h2>
                        <button class="btn btn-primary" onclick="showNewUserModal()">+ Crear Nuevo Usuario</button>
                        <div id="lista-usuarios" style="margin-top:20px;"></div>
                    </div>
                `;
                cargarUsuarios();
            } else if (tab === 2) {
                content.innerHTML = `
                    <div class="card">
                        <h2>🎰 Configuración de Ruleta</h2>
                        <label>Premios Ruleta Normal</label>
                        <input type="text" id="premios-normal" placeholder="3000,5000,8000,10000,15000,20000">
                        <label>Premios Ruleta Dorada</label>
                        <input type="text" id="premios-dorada" placeholder="15000,25000,40000,50000,100000">
                        <label>Días para activar Ruleta Dorada</label>
                        <input type="number" id="dias-dorada" value="7" min="1">
                        <button class="btn btn-primary" onclick="guardarRuleta()">Guardar Configuración</button>
                    </div>
                `;
            } else if (tab === 1) {
                content.innerHTML = `
                    <div class="card">
                        <h2>Configuración General</h2>
                        <label>Nombre del Casino</label>
                        <input type="text" id="nombre-casino">
                        <label>WhatsApp de atención</label>
                        <input type="text" id="whatsapp">
                        <label>Links de Salas (4)</label>
                        <input type="text" id="sala1" placeholder="Sala 1">
                        <input type="text" id="sala2" placeholder="Sala 2">
                        <input type="text" id="sala3" placeholder="Sala 3">
                        <input type="text" id="sala4" placeholder="Sala 4">
                        <button class="btn btn-primary" onclick="guardarConfig()">Guardar</button>
                    </div>
                `;
            } else {
                content.innerHTML = `<h2>Bienvenido al Panel</h2><p>Selecciona una sección.</p>`;
            }
        }

        async function guardarConfig() {
            if (!currentSubscriberId) return alert("Error: No se detectó el suscriptor");
            // ... (guardado de configuración)
            alert("✅ Configuración guardada");
        }

        async function guardarRuleta() {
            if (!currentSubscriberId) return alert("Error: No se detectó el suscriptor");
            // ... (guardado de ruleta)
            alert("✅ Configuración de Ruleta guardada");
        }

        function showNewUserModal() {
            document.getElementById('modal-nuevo-usuario').style.display = 'flex';
        }

        function hideNewUserModal() {
            document.getElementById('modal-nuevo-usuario').style.display = 'none';
        }

        async function crearNuevoUsuario() {
            const username = document.getElementById('new-username').value.trim();
            const password = document.getElementById('new-password').value.trim();
            if (!username || !password) return alert("Usuario y contraseña son obligatorios");

            const { error } = await _supabase.from('usuarios').insert({
                subscriber_id: currentSubscriberId,
                username: username,
                password: password
            });

            if (error) alert("Error: " + error.message);
            else {
                alert(`✅ Usuario "${username}" creado`);
                hideNewUserModal();
            }
        }

        function logout() {
            if (confirm("¿Cerrar sesión?")) location.reload();
        }

        window.onload = () => {};
    </script>
</body>
</html>
