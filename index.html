<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Suscriptor - Nucky SaaS</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #a3e635; --dark: #0f172a; --gray: #1e2937; }
        body { font-family: system-ui, sans-serif; background: #020617; color: white; margin:0; }
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #334155; }
        .tabs { display: flex; gap: 8px; margin: 20px 0; flex-wrap: wrap; overflow-x: auto; padding-bottom: 10px; }
        .tab { padding: 10px 16px; background: var(--gray); border-radius: 8px; cursor: pointer; font-size: 0.95em; white-space: nowrap; }
        .tab.active { background: var(--primary); color: black; font-weight: bold; }
        .card { background: var(--gray); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; background: #334155; border: none; border-radius: 8px; color: white; }
        .btn { padding: 14px; width: 100%; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; margin: 10px 0; }
        .btn-primary { background: var(--primary); color: black; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👤 Panel Suscriptor</h1>
            <button class="btn btn-danger" onclick="logout()">Salir</button>
        </div>

        <div class="tabs">
            <div class="tab" onclick="switchTab(0)">Inicio</div>
            <div class="tab active" onclick="switchTab(1)">Configuración</div>
            <div class="tab" onclick="switchTab(2)">Ruleta</div>
            <div class="tab" onclick="switchTab(3)">Usuarios</div>
            <div class="tab" onclick="switchTab(4)">Difusión</div>
        </div>

        <div id="tab-content">
            <!-- Configuración -->
            <div class="card">
                <h2>Configuración General</h2>
                <input type="text" id="nombre-casino" placeholder="Nombre del Casino">
                <input type="text" id="whatsapp" placeholder="WhatsApp de atención">
                <input type="text" id="telegram" placeholder="Telegram (opcional)">
                <input type="text" id="instagram" placeholder="Instagram (opcional)">
                <textarea id="link-salas" placeholder="Links de las salas de juego (uno por línea)"></textarea>
                <button class="btn btn-primary" onclick="guardarConfiguracion()">Guardar Configuración</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://vevptiayzleigkjtmyhc.supabase.co";
        const SUPABASE_KEY = "sb_publishable_VBu6hcwr-NKDyxcOc60wDQ_RFDkKQjd";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentSubscriberId = null;

        async function loginSuscriptor() {
            // ... (mantengo el login anterior)
        }

        async function switchTab(tab) {
            document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === tab));
            const content = document.getElementById('tab-content');
            content.innerHTML = `<h2>Cargando...</h2>`;

            if (tab === 1) { // Configuración
                content.innerHTML = `
                    <div class="card">
                        <h2>Configuración General</h2>
                        <input type="text" id="nombre-casino" placeholder="Nombre del Casino">
                        <input type="text" id="whatsapp" placeholder="WhatsApp de atención (+549...)">
                        <input type="text" id="telegram" placeholder="Telegram (opcional)">
                        <input type="text" id="instagram" placeholder="Instagram (opcional)">
                        <textarea id="link-salas" placeholder="Links de salas (uno por línea)" rows="4"></textarea>
                        <button class="btn btn-primary" onclick="guardarConfiguracion()">Guardar Cambios</button>
                    </div>
                `;
            }
        }

        async function guardarConfiguracion() {
            alert("✅ Configuración guardada (función en desarrollo)");
        }

        function logout() {
            if (confirm("¿Cerrar sesión?")) location.reload();
        }

        window.onload = () => {
            // Simular login por ahora
            currentSubscriberId = "prueba-id"; // Cambiar después
            switchTab(1);
        };
    </script>
</body>
</html>
