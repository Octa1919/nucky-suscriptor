<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Suscriptor - Nucky SaaS</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #a3e635; --dark: #0f172a; --gray: #1e2937; }
        body { font-family: system-ui, sans-serif; background: #020617; color: white; margin:0; }
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #334155; }
        .tabs { display: flex; gap: 8px; margin: 20px 0; flex-wrap: wrap; overflow-x: auto; padding-bottom: 10px; }
        .tab { padding: 10px 16px; background: var(--gray); border-radius: 8px; cursor: pointer; font-size: 0.95em; white-space: nowrap; }
        .tab.active { background: var(--primary); color: black; font-weight: bold; }
        .card { background: var(--gray); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
        label { display: block; margin: 16px 0 6px; font-size: 0.9em; color: #94a3b8; }
        input, textarea { 
            width: 100%; 
            padding: 14px; 
            background: #334155; 
            border: 1px solid #475569; 
            border-radius: 10px; 
            color: white; 
            font-size: 1em; 
        }
        .btn { 
            padding: 14px; 
            width: 100%; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: bold; 
            margin-top: 20px; 
        }
        .btn-primary { background: var(--primary); color: black; }
        
        /* Responsive para los 4 links */
        .sala-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }
        @media (min-width: 640px) {
            .sala-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👤 Panel Suscriptor</h1>
            <button class="btn btn-danger" onclick="logout()">Salir</button>
        </div>

        <div class="tabs">
            <div class="tab" onclick="switchTab(0)">Inicio</div>
            <div class="tab active" onclick="switchTab(1)">Configuración</div>
            <div class="tab" onclick="switchTab(2)">Ruleta</div>
            <div class="tab" onclick="switchTab(3)">Usuarios</div>
            <div class="tab" onclick="switchTab(4)">Difusión</div>
        </div>

        <div id="tab-content"></div>
    </div>

    <script>
        const SUPABASE_URL = "https://vevptiayzleigkjtmyhc.supabase.co";
        const SUPABASE_KEY = "sb_publishable_VBu6hcwr-NKDyxcOc60wDQ_RFDkKQjd";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function switchTab(tab) {
            document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === tab));
            const content = document.getElementById('tab-content');

            if (tab === 1) {
                content.innerHTML = `
                    <div class="card">
                        <h2>Configuración General</h2>
                        
                        <label>Nombre del Casino</label>
                        <input type="text" id="nombre-casino" placeholder="Nombre del Casino">

                        <label>WhatsApp de atención (+549...)</label>
                        <input type="text" id="whatsapp" placeholder="+5492478425018">

                        <label>Telegram (opcional)</label>
                        <input type="text" id="telegram" placeholder="https://t.me/...">

                        <label>Instagram (opcional)</label>
                        <input type="text" id="instagram" placeholder="https://instagram.com/...">

                        <label>Links de Salas de Juego (4 en total)</label>
                        <div class="sala-grid">
                            <input type="text" id="sala1" placeholder="Sala 1 - Link">
                            <input type="text" id="sala2" placeholder="Sala 2 - Link">
                            <input type="text" id="sala3" placeholder="Sala 3 - Link">
                            <input type="text" id="sala4" placeholder="Sala 4 - Link">
                        </div>

                        <button class="btn btn-primary" onclick="guardarConfiguracion()">Guardar Cambios</button>
                    </div>
                `;
            } else {
                content.innerHTML = `<h2>Sección en desarrollo</h2>`;
            }
        }

        async function guardarConfiguracion() {
            alert("✅ Configuración guardada (próximamente se guardará en Supabase)");
        }

        function logout() {
            if (confirm("¿Cerrar sesión?")) location.reload();
        }

        window.onload = () => {
            switchTab(1); // Abre directamente en Configuración
        };
    </script>
</body>
</html>
