<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Suscriptor - Nucky SaaS</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #a3e635; --dark: #0f172a; --gray: #1e2937; }
        body { font-family: system-ui, sans-serif; background: #020617; color: white; margin:0; }
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #334155; }
        .tabs { display: flex; gap: 8px; margin: 20px 0; flex-wrap: wrap; }
        .tab { padding: 10px 16px; background: var(--gray); border-radius: 8px; cursor: pointer; font-size: 0.95em; }
        .tab.active { background: var(--primary); color: black; font-weight: bold; }
        .card { background: var(--gray); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .btn { padding: 12px 20px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; margin: 8px 0; }
        .btn-primary { background: var(--primary); color: black; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👤 Panel Suscriptor</h1>
            <button class="btn btn-danger" onclick="logout()">Salir</button>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab(0)">Inicio</div>
            <div class="tab" onclick="switchTab(1)">Configuración</div>
            <div class="tab" onclick="switchTab(2)">Ruleta</div>
            <div class="tab" onclick="switchTab(3)">Usuarios</div>
            <div class="tab" onclick="switchTab(4)">Difusión</div>
        </div>

        <!-- Contenido de pestañas -->
        <div id="tab-content">
            <!-- Se irán llenando según la pestaña -->
            <h2>Bienvenido a tu Panel</h2>
            <p>Desde aquí podrás configurar tu casino, ruleta, CBU, usuarios y más.</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://vevptiayzleigkjtmyhc.supabase.co";
        const SUPABASE_KEY = "sb_publishable_VBu6hcwr-NKDyxcOc60wDQ_RFDkKQjd";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentSubscriberId = null;

        async function loadSubscriberData() {
            // Por ahora simulamos login
            const slug = prompt("Ingresa tu slug para probar (ej: casino-prueba):");
            if (!slug) return;

            const { data } = await _supabase
                .from('suscriptores')
                .select('*')
                .eq('slug', slug)
                .single();

            if (data) {
                currentSubscriberId = data.id;
                alert(`✅ Bienvenido, ${data.nombre_casino || data.nombre}`);
                // Aquí cargaremos los datos según la pestaña
            } else {
                alert("Slug no encontrado");
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === tab));
            const content = document.getElementById('tab-content');
            
            if (tab === 0) content.innerHTML = `<h2>Inicio</h2><p>Panel de control de tu casino.</p>`;
            if (tab === 1) content.innerHTML = `<h2>Configuración General</h2><p>Aquí irán logo, colores, WhatsApp, links, etc.</p>`;
            if (tab === 2) content.innerHTML = `<h2>Configuración de Ruleta</h2><p>Aquí configurarás los premios normal y dorada.</p>`;
            if (tab === 3) content.innerHTML = `<h2>Usuarios Jugadores</h2><p>Crear, editar y eliminar usuarios.</p>`;
            if (tab === 4) content.innerHTML = `<h2>Difusión OneSignal</h2><p>Enviar notificaciones a tus jugadores.</p>`;
        }

        function logout() {
            if (confirm("¿Cerrar sesión?")) location.reload();
        }

        window.onload = loadSubscriberData;
    </script>
</body>
</html>
