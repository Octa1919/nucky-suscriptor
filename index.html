<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Suscriptor - Nucky SaaS</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #a3e635;
            --dark: #0a0f1c;
            --card: #121a2e;
            --text: #e2e8f0;
        }
        * { box-sizing: border-box; margin:0; padding:0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(180deg, #0a0f1c, #020617);
            color: var(--text);
            min-height: 100vh;
        }
        .header {
            background: rgba(18, 26, 46, 0.95);
            backdrop-filter: blur(12px);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(163, 230, 53, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .casino-name {
            font-size: 1.4rem;
            font-weight: 700;
            color: white;
        }
        .btn-salir {
            background: #ef4444;
            color: white;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .tabs {
            display: flex;
            background: rgba(18, 26, 46, 0.9);
            padding: 8px;
            border-radius: 16px;
            margin: 20px 20px 10px;
            gap: 6px;
        }
        .tab {
            flex: 1;
            padding: 14px 12px;
            text-align: center;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.95rem;
        }
        .tab.active {
            background: var(--primary);
            color: black;
            box-shadow: 0 4px 15px rgba(163, 230, 53, 0.4);
        }
        .card {
            background: var(--card);
            border-radius: 20px;
            padding: 24px;
            margin: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        label {
            display: block;
            margin: 16px 0 8px;
            font-size: 0.9rem;
            color: #94a3b8;
        }
        input {
            width: 100%;
            padding: 16px 18px;          /* ← más espacio interno */
            border-radius: 12px;
            border: 1px solid #334155;
            background: #1e2937;
            color: white;
            font-size: 1rem;
        }
        .btn-primary {
            background: var(--primary);
            color: black;
            font-weight: 700;
            border: none;
            padding: 16px;
            border-radius: 12px;
            margin-top: 10px;
            cursor: pointer;
            font-size: 1.05rem;
        }
        .user-item {
            background: #1e2937;
            padding: 16px;
            border-radius: 14px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .user-item:hover { background: #334155; }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--card);
            width: 92%;
            max-width: 480px;
            border-radius: 20px;
            padding: 28px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="casino-name" id="casino-name">Nucky Casino</div>
        <button class="btn-salir" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i>
        </button>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab(0)">Vivo</div>
        <div class="tab" onclick="switchTab(1)">Configuración</div>
        <div class="tab" onclick="switchTab(2)">Usuarios</div>
        <div class="tab" onclick="switchTab(3)">Difu</div>
    </div>

    <div id="tab-content" class="container"></div>

    <!-- Modal Nuevo Usuario -->
    <div id="modal-nuevo-usuario" class="modal">
        <div class="modal-content">
            <h2>Crear Nuevo Usuario</h2>
            <input type="text" id="new-username" placeholder="Nombre de usuario">
            <input type="text" id="new-password" placeholder="Contraseña">
            <input type="text" id="new-telefono" placeholder="Teléfono (opcional)">
            <button class="btn-primary" onclick="crearNuevoUsuario()">Crear Usuario</button>
            <button onclick="hideNewUserModal()" style="background:#334155;color:white;margin-top:8px;">Cancelar</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://vevptiayzleigkjtmyhc.supabase.co";
        const SUPABASE_KEY = "sb_publishable_VBu6hcwr-NKDyxcOc60wDQ_RFDkKQjd";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentSubscriberId = null;

        async function loginSuscriptor() {
            const username = document.getElementById('login-user').value.trim();
            const password = document.getElementById('login-pass').value.trim();
            if (!username || !password) return alert("Usuario y contraseña son obligatorios");

            const { data, error } = await _supabase
                .from('suscriptores_users')
                .select('*, suscriptores(id)')
                .eq('nombre', username)
                .eq('password', password)
                .single();

            if (error || !data) return alert("Credenciales incorrectas");

            currentSubscriberId = data.suscriptores.id;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            await cargarNombreCasino();
            switchTab(0);
        }

        async function cargarNombreCasino() {
            if (!currentSubscriberId) return;
            const { data } = await _supabase
                .from('suscriptores')
                .select('nombre_casino')
                .eq('id', currentSubscriberId)
                .single();
            if (data && data.nombre_casino) {
                document.getElementById('casino-name').textContent = data.nombre_casino;
            }
        }

        async function switchTab(tab) {
            document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === tab));
            const content = document.getElementById('tab-content');

            if (tab === 0) {
                content.innerHTML = `<div class="card"><h2><i class="fas fa-broadcast-tower"></i> Vivo - Resultados Ruleta</h2><div id="lista-en-vivo">Cargando resultados en vivo...</div></div>`;
            } else if (tab === 1) {
                content.innerHTML = `
                    <div class="card">
                        <h2>⚙️ Configuración General</h2>
                        <label>Nombre del Casino</label>
                        <input type="text" id="nombre-casino">
                        <label>WhatsApp de atención</label>
                        <input type="text" id="whatsapp">
                        <button class="btn-primary" onclick="guardarConfig()">Guardar Configuración General</button>
                    </div>
                    <div class="card">
                        <h2>🎰 Configuración de Ruleta</h2>
                        <label>Premios Ruleta Normal (separados por coma)</label>
                        <input type="text" id="premios-normal" placeholder="3000,5000,8000...">
                        <label>Premios Ruleta Dorada</label>
                        <input type="text" id="premios-dorada" placeholder="15000,25000,40000...">
                        <label>Días para activar Ruleta Dorada</label>
                        <input type="number" id="dias-dorada" value="7" min="1">
                        <button class="btn-primary" onclick="guardarRuleta()">Guardar Ruleta</button>
                    </div>
                `;
            } else if (tab === 2) {
                content.innerHTML = `
                    <div class="card">
                        <h2>👥 Usuarios Jugadores</h2>
                        <button class="btn-primary" onclick="showNewUserModal()" style="margin-bottom:20px;">+ Crear Nuevo Usuario</button>
                        <div id="lista-usuarios"></div>
                    </div>
                `;
                cargarUsuarios();
            } else if (tab === 3) {
                content.innerHTML = `<div class="card"><h2>📢 Difusión OneSignal</h2><p>Próximamente: envía notificaciones y difusiones a tus jugadores.</p></div>`;
            }
        }

        // ==================== GUARDADO (igual que antes) ====================
        async function guardarConfig() {
            if (!currentSubscriberId) return alert("Error: No se detectó el suscriptor");
            const nombre = document.getElementById('nombre-casino').value.trim();
            const whatsapp = document.getElementById('whatsapp').value.trim();
            const { error } = await _supabase
                .from('suscriptores')
                .update({ nombre_casino: nombre || null, whatsapp: whatsapp || null })
                .eq('id', currentSubscriberId);
            if (error) alert("Error: " + error.message);
            else alert("✅ Configuración General guardada");
        }

        async function guardarRuleta() {
            if (!currentSubscriberId) return alert("Error: No se detectó el suscriptor");
            const normal = document.getElementById('premios-normal').value.trim();
            const dorada = document.getElementById('premios-dorada').value.trim();
            const dias = parseInt(document.getElementById('dias-dorada').value) || 7;
            const { error } = await _supabase
                .from('config_ruleta')
                .upsert({
                    subscriber_id: currentSubscriberId,
                    premios_normal: normal ? normal.split(',').map(p => p.trim()) : [],
                    premios_dorada: dorada ? dorada.split(',').map(p => p.trim()) : [],
                    dias_dorada: dias
                });
            if (error) alert("Error: " + error.message);
            else alert("✅ Configuración de Ruleta guardada");
        }

        // ==================== USUARIOS ====================
        async function cargarUsuarios() {
            const div = document.getElementById('lista-usuarios');
            div.innerHTML = "<p>Cargando...</p>";
            const { data } = await _supabase
                .from('usuarios')
                .select('*')
                .eq('subscriber_id', currentSubscriberId)
                .order('created_at', { ascending: false });
            if (!data || data.length === 0) {
                div.innerHTML = "<p>Aún no hay usuarios creados.</p>";
                return;
            }
            div.innerHTML = data.map(u => `
                <div class="user-item" onclick="editarUsuario('${u.id}')">
                    <strong>${u.username}</strong><br>
                    <small>${u.telefono || 'Sin teléfono'}</small>
                </div>
            `).join('');
        }

        function showNewUserModal() {
            document.getElementById('modal-nuevo-usuario').style.display = 'flex';
        }
        function hideNewUserModal() {
            document.getElementById('modal-nuevo-usuario').style.display = 'none';
        }
        async function crearNuevoUsuario() {
            const username = document.getElementById('new-username').value.trim();
            const password = document.getElementById('new-password').value.trim();
            const telefono = document.getElementById('new-telefono').value.trim();
            if (!username || !password) return alert("Usuario y contraseña son obligatorios");
            const { error } = await _supabase.from('usuarios').insert({
                subscriber_id: currentSubscriberId,
                username: username,
                password: password,
                telefono: telefono || null
            });
            if (error) alert("Error: " + error.message);
            else {
                alert(`✅ Usuario "${username}" creado`);
                hideNewUserModal();
                cargarUsuarios();
            }
        }
        function editarUsuario(id) {
            alert("Editar usuario (en desarrollo)");
        }
        function logout() {
            if (confirm("¿Cerrar sesión?")) location.reload();
        }

        window.onload = () => {};
    </script>
</body>
</html>
